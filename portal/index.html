<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISWT Team Portal</title>
  <meta name="description" content="Central hub for all internal ISWT Team portals and tools." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Top navigation bar -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <div class="brand__mark">IS</div>
        <div class="brand__text">
          <span class="brand__title">ISWT Team Portal</span>
          <span class="brand__subtitle">Internal tools &amp; services hub</span>
        </div>
      </div>

      <div class="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 21l-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" />
        </svg>
        <input id="searchInput" type="search" class="search__input"
               placeholder="Search portals by name, category, or description…"
               autocomplete="off" aria-label="Search portals" />
        <kbd class="search__kbd">/</kbd>
      </div>

      <button id="openRegisterBtn" class="btn btn--primary">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="btn__icon">
          <path d="M12 5v14M5 12h14" />
        </svg>
        Register Portal
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Category filter chips -->
    <nav id="filterBar" class="filters" aria-label="Filter by category"></nav>

    <!-- Stats / export bar -->
    <div class="meta">
      <p id="resultCount" class="meta__count"></p>
      <div class="meta__actions">
        <span id="unsavedBadge" class="badge badge--warn" hidden>Unsaved changes</span>
        <button id="exportBtn" class="btn btn--ghost btn--sm">Export portals.json</button>
      </div>
    </div>

    <!-- Portal cards -->
    <section id="grid" class="grid" aria-live="polite"></section>

    <!-- Empty / no-results state -->
    <div id="emptyState" class="empty" hidden>
      <div class="empty__icon">🔍</div>
      <h2 class="empty__title">No portals found</h2>
      <p class="empty__text">Try a different search, clear the filter, or register a new portal.</p>
    </div>
  </main>

  <!-- Register modal -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__header">
        <h2 id="modalTitle" class="modal__title">Register a new portal</h2>
        <button id="closeModalBtn" class="modal__close" aria-label="Close">&times;</button>
      </div>
      <form id="registerForm" class="form" novalidate>
        <div class="form__row">
          <label class="form__label" for="f-name">Portal name <span>*</span></label>
          <input id="f-name" name="name" type="text" class="form__input" placeholder="e.g. Jira" required />
        </div>
        <div class="form__row">
          <label class="form__label" for="f-url">URL <span>*</span></label>
          <input id="f-url" name="url" type="url" class="form__input" placeholder="https://tool.internal.iswt.local" required />
        </div>
        <div class="form__row">
          <label class="form__label" for="f-category">Category</label>
          <input id="f-category" name="category" type="text" class="form__input" list="categoryList" placeholder="e.g. Monitoring" />
          <datalist id="categoryList"></datalist>
        </div>
        <div class="form__row">
          <label class="form__label" for="f-description">Description</label>
          <textarea id="f-description" name="description" class="form__input form__input--area" rows="3" placeholder="Short description of what this portal is for."></textarea>
        </div>
        <p id="formError" class="form__error" hidden></p>
        <div class="form__actions">
          <button type="button" id="cancelBtn" class="btn btn--ghost">Cancel</button>
          <button type="submit" class="btn btn--primary">Add &amp; open</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <footer class="footer">
    <span>ISWT Team Portal</span>
    <span class="footer__dot">•</span>
    <span>Internal use only</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
